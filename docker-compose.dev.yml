services:
  # Override backend for development
  backend:
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://admin:password123@mongodb:27017/api-testing-tools?authSource=admin
      JWT_SECRET: dev-jwt-secret-key
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "9229:9229"  # Debug port

  # Override frontend for development
  frontend:
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_APP_NAME: API Testing Tools (Dev)
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    ports:
      - "3000:3000"

  # Add Redis for development (optional)
  redis:
    image: redis:7-alpine
    container_name: api-testing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - api-testing-network
    profiles:
      - redis

volumes:
  redis_data:
    driver: local
